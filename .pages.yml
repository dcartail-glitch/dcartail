media:
  input: src/assets/artikel
  output: /assets/artikel
  rename: safe
  categories: [image]

content:
  - name: artikel
    label: Artikel D'Cartail
    type: collection
    path: src/artikel
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, date, description]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Judul artikel
        type: string
        required: true
      - name: description
        label: Deskripsi singkat
        type: text
        required: true
        description: Ringkasan untuk daftar artikel dan hasil pencarian.
      - name: date
        label: Tanggal artikel
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: eyebrow
        label: Label kecil di atas judul
        type: string
        description: Opsional. Jika kosong, tampil sebagai d'Cartail.
      - name: layout
        type: string
        default: layouts/artikel.njk
        hidden: true
      - name: body
        label: Isi artikel
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
