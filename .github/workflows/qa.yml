name: QA Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run QA Check
        run: node tools/qa-check.js
      
      - name: Build Eleventy
        run: npx @11ty/eleventy
